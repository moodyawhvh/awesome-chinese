# GitHub Actions 工作流:Awesome 清单 lint 检查
# 触发条件:有 Pull Request 以 main 为目标分支、且改动了 readme.md 时运行
on:
  pull_request:
    branches: [main]
    paths:
      - 'readme.md'
jobs:
  lint:
    # 在最新版 Ubuntu 环境中执行 lint
    runs-on: ubuntu-latest
    steps:
      # 拉取完整历史(fetch-depth: 0),便于后续 git diff 对比 origin/main
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # 执行 awesome-lint 校验 PR 中新增的清单链接
      - name: awesome-lint
        run: ./.github/workflows/repo_linter.sh
